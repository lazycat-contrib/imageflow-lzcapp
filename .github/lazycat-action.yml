version: 1

project:
  root: .
  build_config: lzc-build.yml
  package_file: package.yml
  output: .lazycat-build/imageflow.lpk
  target_arch: amd64

update:
  strategy: publish
  allow_downgrade: false
  version_source:
    type: image
    image: images
build:
  run_buildscript: false
images:
  # 上游有完整三段 SemVer tag（1.4.x/2.0.x/2.1.x），排除 latest、v2.2 等两段式别名
  - id: images
    target: service
    service: images
    source: soyorins/imageflow
    channel: stable
    sort: semver
    tag_regex: '^v?\d+\.\d+\.\d+$'
    delivery:
      mode: mirror

stores:
  official:
    # Official store publication is intentionally disabled; publish only to Miaomiao Store.
    enabled: false
  private:
    enabled: true
    skip_if_version_exists: true
    name: ImageFlow
    summary: "高效智能的图像管理和分发系统"
